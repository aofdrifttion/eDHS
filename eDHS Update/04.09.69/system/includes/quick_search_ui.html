<!-- ============================================================
     Quick Search Modal (Ctrl+K) — eDHS
     ใส่ไฟล์นี้ก่อนปิด </body> ในทุกหน้าที่ต้องการ
     require: jQuery, SweetAlert2 (มีอยู่แล้วในระบบ)
     ============================================================ -->

<!-- ✅ Quick Search Overlay -->
<div id="qs-overlay" style="display:none;" onclick="qs_close()"></div>

<!-- ✅ Quick Search Modal -->
<div id="qs-modal" role="dialog" aria-label="Quick Search" aria-modal="true" style="display:none;">
    <div id="qs-header">
        <div id="qs-search-wrap">
            <svg id="qs-icon-search" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input id="qs-input" type="text" placeholder="ค้นหา VN, AN, HN, ชื่อผู้ป่วย, CID, เลขใบเสร็จ..."
                autocomplete="off" spellcheck="false">
            <div id="qs-spinner" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path
                        d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
                </svg>
            </div>
            <kbd id="qs-kbd-esc" onclick="qs_close()">ESC</kbd>
        </div>
    </div>

    <div id="qs-body">
        <!-- State: empty / hint -->
        <div id="qs-hint" class="qs-state">
            <div class="qs-hint-grid">
                <div class="qs-hint-item">
                    <div class="qs-hint-icon qs-icon-blue">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="2" y="3" width="20" height="14" rx="2" />
                            <path d="M8 21h8M12 17v4" />
                        </svg>
                    </div>
                    <div>
                        <p class="qs-hint-label">VN / AN</p>
                        <p class="qs-hint-sub">Visit/Admit Number</p>
                    </div>
                </div>
                <div class="qs-hint-item">
                    <div class="qs-hint-icon qs-icon-green">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </div>
                    <div>
                        <p class="qs-hint-label">ชื่อผู้ป่วย</p>
                        <p class="qs-hint-sub">ค้นหาด้วยชื่อ-นามสกุล</p>
                    </div>
                </div>
                <div class="qs-hint-item">
                    <div class="qs-hint-icon qs-icon-purple">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" />
                            <path d="M16 2v4M8 2v4M3 10h18" />
                        </svg>
                    </div>
                    <div>
                        <p class="qs-hint-label">เลขบัตร CID</p>
                        <p class="qs-hint-sub">รหัสบัตรประชาชน 13 หลัก</p>
                    </div>
                </div>
                <div class="qs-hint-item">
                    <div class="qs-hint-icon qs-icon-orange">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14,2 14,8 20,8" />
                        </svg>
                    </div>
                    <div>
                        <p class="qs-hint-label">เลขใบเสร็จ</p>
                        <p class="qs-hint-sub">ค้นหาจากเลขที่ใบเสร็จ</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- State: loading -->
        <div id="qs-loading" class="qs-state" style="display:none;">
            <div class="qs-loading-wrap">
                <div class="qs-dot-wave"><span></span><span></span><span></span></div>
                <p>กำลังค้นหา...</p>
            </div>
        </div>

        <!-- State: no result -->
        <div id="qs-empty" class="qs-state" style="display:none;">
            <div class="qs-empty-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.5">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    <line x1="8" y1="11" x2="14" y2="11" />
                </svg>
                <h4>ไม่พบข้อมูล</h4>
                <p id="qs-empty-kw"></p>
            </div>
        </div>

        <!-- State: results -->
        <div id="qs-results" style="display:none;">
            <!-- Menu shortcuts -->
            <div id="qs-section-menus" style="display:none;">
                <p class="qs-section-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2"
                        style="width:14px;height:14px;display:inline;margin-right:5px;">
                        <path d="M3 3h6l6 12h6" />
                        <path d="M3 21h6" />
                    </svg>เมนูที่เกี่ยวข้อง</p>
                <div id="qs-menus-list"></div>
            </div>
            <!-- Patient results -->
            <div id="qs-section-patients" style="display:none;">
                <p class="qs-section-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2"
                        style="width:14px;height:14px;display:inline;margin-right:5px;">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>ข้อมูลลูกหนี้ <span id="qs-count-badge"></span></p>
                <div id="qs-patients-list"></div>
            </div>
        </div>
    </div>

    <div id="qs-footer" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
            <span><kbd>↑</kbd><kbd>↓</kbd> เลือก</span>
            <span><kbd>Enter</kbd> เปิดรายละเอียด</span>
            <span><kbd>Ctrl+K</kbd> เปิด/ปิด</span>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
            <button type="button" onclick="qs_toggle_font(event)" title="ปรับขนาดตัวอักษร" style="cursor:pointer; background:none; border:none; font-size:16px; color:#6b73a0; padding:0; display:flex; align-items:center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
            </button>
            <button type="button" onclick="qs_toggle_dark(event)" title="โหมดกลางคืน" style="cursor:pointer; background:none; border:none; font-size:16px; color:#6b73a0; padding:0; display:flex; align-items:center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </div>
</div>



<!-- ============================================================ STYLES ============================================================ -->
<style>
    /* ---- Overlay ---- */
    #qs-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 15, 30, 0.55);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 99998;
    }

    /* ---- Modal Container ---- */
    #qs-modal {
        position: fixed;
        top: 12vh;
        left: 0;
        right: 0;
        margin: 0 auto;
        width: 720px;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 32px 80px rgba(67, 97, 238, 0.18), 0 8px 24px rgba(0, 0, 0, 0.12);
        z-index: 99999;
        overflow: hidden;
        max-height: 76vh;
        display: flex;
        flex-direction: column;
        font-family: 'Sarabun', 'Public Sans', sans-serif;
    }

    @keyframes qs-fade-in {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    /* ---- Header / Search Input ---- */
    #qs-header {
        padding: 16px 20px 0;
        flex-shrink: 0;
    }

    #qs-search-wrap {
        display: flex;
        align-items: center;
        background: #f5f6fa;
        border: 2px solid #e0e3f0;
        border-radius: 14px;
        padding: 10px 16px;
        gap: 12px;
        transition: border-color 0.2s;
    }

    #qs-search-wrap:focus-within {
        border-color: #696cff;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(105, 108, 255, 0.1);
    }

    #qs-icon-search {
        width: 22px;
        height: 22px;
        color: #9094b1;
        flex-shrink: 0;
    }

    #qs-input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 16px;
        color: #1a1d2e;
        outline: none;
        font-family: inherit;
    }

    #qs-input::placeholder {
        color: #aab0cb;
    }

    #qs-spinner svg {
        width: 20px;
        height: 20px;
        color: #696cff;
        animation: qs-spin 0.8s linear infinite;
    }

    @keyframes qs-spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    #qs-kbd-esc {
        padding: 3px 8px;
        background: #e8eaf5;
        border: 1px solid #d0d4ea;
        border-radius: 6px;
        font-size: 11px;
        color: #6b73a0;
        cursor: pointer;
        font-family: inherit;
        flex-shrink: 0;
    }

    #qs-kbd-esc:hover {
        background: #d5d8f0;
    }

    /* ---- Body ---- */
    #qs-body {
        overflow-y: auto;
        flex: 1;
        padding: 12px 20px 8px;
        overscroll-behavior: contain;
    }

    #qs-body::-webkit-scrollbar {
        width: 6px;
    }

    #qs-body::-webkit-scrollbar-track {
        background: transparent;
    }

    #qs-body::-webkit-scrollbar-thumb {
        background: #dde1f5;
        border-radius: 4px;
    }

    /* ---- States ---- */
    .qs-state {
        padding: 8px 0;
    }

    /* Hint grid */
    .qs-hint-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
    }

    .qs-hint-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f8f9fe;
        border: 1px solid #eef0fa;
        border-radius: 12px;
        padding: 12px;
    }

    .qs-hint-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .qs-hint-icon svg {
        width: 20px;
        height: 20px;
    }

    .qs-icon-blue {
        background: #eef2ff;
        color: #4361ee;
    }

    .qs-icon-green {
        background: #e8fdf0;
        color: #22c55e;
    }

    .qs-icon-purple {
        background: #f4efff;
        color: #8c57ff;
    }

    .qs-icon-orange {
        background: #fff3e8;
        color: #ff914d;
    }

    .qs-hint-label {
        font-weight: 600;
        font-size: 13px;
        color: #2d3052;
        margin: 0;
    }

    .qs-hint-sub {
        font-size: 11px;
        color: #9094b1;
        margin: 0;
    }

    .qs-shortcut-tip {
        text-align: center;
        font-size: 12px;
        color: #aab0cb;
        margin: 4px 0 0;
    }

    .qs-shortcut-tip kbd {
        display: inline-block;
        padding: 2px 6px;
        background: #eef0fa;
        border: 1px solid #d5d8f0;
        border-radius: 5px;
        font-size: 11px;
        color: #5c6480;
        margin: 0 2px;
        font-family: inherit;
    }

    /* Loading dots */
    .qs-loading-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 0;
        gap: 12px;
        color: #9094b1;
        font-size: 14px;
    }

    .qs-dot-wave {
        display: flex;
        gap: 6px;
    }

    .qs-dot-wave span {
        display: inline-block;
        width: 10px;
        height: 10px;
        background: #696cff;
        border-radius: 50%;
        animation: qs-bounce 1.2s infinite ease-in-out;
    }

    .qs-dot-wave span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .qs-dot-wave span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes qs-bounce {

        0%,
        80%,
        100% {
            transform: scale(0.7);
            opacity: 0.5;
        }

        40% {
            transform: scale(1.2);
            opacity: 1;
        }
    }

    /* Empty state */
    .qs-empty-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 0;
        gap: 8px;
        color: #9094b1;
    }

    .qs-empty-wrap svg {
        width: 52px;
        height: 52px;
        color: #dde1f5;
    }

    .qs-empty-wrap h4 {
        font-size: 16px;
        font-weight: 600;
        color: #444;
        margin: 0;
    }

    .qs-empty-wrap p {
        font-size: 13px;
        margin: 0;
    }

    /* Section title */
    .qs-section-title {
        font-size: 11px;
        font-weight: 700;
        color: #9094b1;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 8px 0 6px;
        display: flex;
        align-items: center;
    }

    /* Count badge */
    #qs-count-badge {
        margin-left: 6px;
        background: #696cff;
        color: #fff;
        border-radius: 10px;
        padding: 1px 7px;
        font-size: 10px;
        font-weight: 700;
    }

    /* ---- Menu Result Item ---- */
    .qs-menu-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-radius: 12px;
        cursor: pointer;
        border: 1px solid transparent;
        margin-bottom: 4px;
        text-decoration: none;
        color: inherit;
    }

    .qs-menu-item:hover,
    .qs-menu-item.qs-active {
        background: #f0f1ff;
        border-color: #d5d8f8;
        color: #4361ee;
    }

    .qs-menu-icon {
        width: 34px;
        height: 34px;
        background: #eef2ff;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 18px;
        color: #4361ee;
    }

    .qs-menu-name {
        font-size: 14px;
        font-weight: 500;
    }

    /* ---- Patient Result Item ---- */
    .qs-patient-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
        border: 1px solid transparent;
        margin-bottom: 5px;
    }

    .qs-patient-item:hover,
    .qs-patient-item.qs-active {
        background: #f8f9fe;
        border-color: #e0e3f8;
    }

    .qs-type-badge {
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
        margin-top: 2px;
        letter-spacing: 0.04em;
    }

    .qs-badge-opd {
        background: #e0f7fa;
        color: #0077a8;
    }

    .qs-badge-ipd {
        background: #fce4ec;
        color: #c2185b;
    }

    .qs-badge-ems {
        background: #fff3e0;
        color: #e65100;
    }

    .qs-patient-info {
        flex: 1;
        min-width: 0;
    }

    .qs-patient-name {
        font-size: 14px;
        font-weight: 600;
        color: #1a1d2e;
        margin: 0 0 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .qs-patient-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
        color: #6b73a0;
    }

    .qs-patient-meta span {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .qs-patient-debit {
        text-align: right;
        flex-shrink: 0;
    }

    .qs-debit-val {
        font-size: 14px;
        font-weight: 700;
        color: #e53e3e;
        white-space: nowrap;
    }

    .qs-paid-val {
        font-size: 11px;
        color: #22c55e;
        white-space: nowrap;
    }

    mark.qs-hl {
        background: #fff59d;
        color: inherit;
        border-radius: 3px;
        padding: 0 1px;
    }

    /* ---- Footer ---- */
    #qs-footer {
        padding: 10px 20px;
        border-top: 1px solid #eef0fa;
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: #aab0cb;
        flex-shrink: 0;
    }

    #qs-footer kbd {
        display: inline-block;
        padding: 2px 6px;
        background: #eef0fa;
        border: 1px solid #d5d8f0;
        border-radius: 5px;
        font-size: 11px;
        color: #5c6480;
        margin-right: 3px;
        font-family: inherit;
    }

    /* ---- Floating Button (ซ่อน — ใช้ Search bar ใน Navbar แทน) ---- */
    #qs-fab {
        display: none;
        display: flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #696cff 0%, #4361ee 100%);
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 11px 18px 11px 14px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(67, 97, 238, 0.35), 0 2px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #qs-fab:hover {
        transform: translateY(-3px) scale(1.04);
        box-shadow: 0 10px 28px rgba(67, 97, 238, 0.45);
    }

    #qs-fab:active {
        transform: scale(0.97);
    }

    #qs-fab svg {
        width: 18px;
        height: 18px;
    }

    #qs-fab kbd {
        padding: 2px 7px;
        background: rgba(255, 255, 255, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 6px;
        font-size: 11px;
        font-family: inherit;
        letter-spacing: 0.04em;
    }

    /* qs-nav-item class for keyboard nav */
    .qs-nav-item {
        outline: none;
    }

    @media (max-width: 600px) {
        #qs-modal {
            top: 5vh;
            width: 96vw;
        }

        .qs-hint-grid {
            grid-template-columns: 1fr;
        }

        #qs-footer {
            flex-wrap: wrap;
            gap: 8px;
        }

        #qs-fab span {
            display: none;
        }

        #qs-fab kbd {
            display: none;
        }

        #qs-fab {
            padding: 13px;
            border-radius: 50%;
        }
    }
    /* ---- Dark Mode Overrides ---- */
    #qs-modal.qs-dark {
        background: #1e1e2d;
        color: #e1e3ea;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.4);
    }
    #qs-modal.qs-dark #qs-search-wrap {
        background: #151521;
        border-color: #2b2b40;
    }
    #qs-modal.qs-dark #qs-search-wrap:focus-within {
        border-color: #696cff;
        background: #1e1e2d;
    }
    #qs-modal.qs-dark #qs-input { color: #e1e3ea; }
    #qs-modal.qs-dark #qs-input::placeholder { color: #565674; }
    #qs-modal.qs-dark #qs-icon-search, 
    #qs-modal.qs-dark .qs-hint-sub { color: #565674; }
    #qs-modal.qs-dark .qs-hint-item {
        background: #151521;
        border-color: #2b2b40;
    }
    #qs-modal.qs-dark .qs-hint-label { color: #e1e3ea; }
    #qs-modal.qs-dark .qs-menu-item:hover,
    #qs-modal.qs-dark .qs-menu-item.qs-active,
    #qs-modal.qs-dark .qs-patient-item:hover,
    #qs-modal.qs-dark .qs-patient-item.qs-active {
        background: #2b2b40;
        border-color: #3f3f5a;
    }
    #qs-modal.qs-dark .qs-section-title {
        color: #565674;
        border-bottom-color: #2b2b40;
    }
    #qs-modal.qs-dark .qs-patient-name { color: #e1e3ea; }
    #qs-modal.qs-dark .qs-patient-meta { color: #8c8ea8; }
    #qs-modal.qs-dark #qs-footer {
        background: #151521;
        border-top-color: #2b2b40;
        color: #8c8ea8;
    }
    #qs-modal.qs-dark .qs-kbd-esc, 
    #qs-modal.qs-dark #qs-footer kbd {
        background: #2b2b40;
        border-color: #3f3f5a;
        color: #8c8ea8;
    }
    #qs-modal.qs-dark .qs-hl {
        background: rgba(105, 108, 255, 0.2);
        color: #8c8aff;
    }
    #qs-modal.qs-dark .qs-icon-blue { background: rgba(67, 97, 238, 0.15); color: #738cf1; }
    #qs-modal.qs-dark .qs-icon-green { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    #qs-modal.qs-dark .qs-icon-purple { background: rgba(140, 87, 255, 0.15); color: #a78bfa; }
    #qs-modal.qs-dark .qs-icon-orange { background: rgba(255, 145, 77, 0.15); color: #fb923c; }

    /* ---- Font Size Overrides ---- */
    #qs-modal.qs-font-md { font-size: 1.05em; }
    #qs-modal.qs-font-lg { font-size: 1.15em; }
    
    #qs-modal.qs-font-md #qs-input { font-size: 17px; }
    #qs-modal.qs-font-lg #qs-input { font-size: 19px; }
    
    #qs-modal.qs-font-md .qs-patient-name { font-size: 15px; }
    #qs-modal.qs-font-lg .qs-patient-name { font-size: 17px; }
    
    #qs-modal.qs-font-md .qs-menu-name { font-size: 15px; }
    #qs-modal.qs-font-lg .qs-menu-name { font-size: 16px; }

</style>

<!-- ============================================================ SCRIPT ============================================================ -->
<script>
    (function () {
        'use strict';

        /* ---------- state ---------- */
        let qs_open_flag = false;
        let qs_timer = null;
        let qs_items = [];   // all keyboard-navigable items
        let qs_cursor = -1;

        /* ---------- Theme & Font State ---------- */
        let qs_is_dark = localStorage.getItem('qs_dark') === '1';
        let qs_font_size = parseInt(localStorage.getItem('qs_font') || '0', 10);
        
        function applyTheme() {
            const m = document.getElementById('qs-modal');
            if(!m) return;
            m.classList.toggle('qs-dark', qs_is_dark);
            m.classList.remove('qs-font-md', 'qs-font-lg');
            if(qs_font_size === 1) m.classList.add('qs-font-md');
            if(qs_font_size === 2) m.classList.add('qs-font-lg');
        }

        window.qs_toggle_dark = function(e) {
            e.stopPropagation();
            qs_is_dark = !qs_is_dark;
            localStorage.setItem('qs_dark', qs_is_dark ? '1' : '0');
            applyTheme();
        };

        window.qs_toggle_font = function(e) {
            e.stopPropagation();
            qs_font_size = (qs_font_size + 1) % 3;
            localStorage.setItem('qs_font', qs_font_size);
            applyTheme();
        };

        /* ---------- DOM refs (lazy) ---------- */
        const $ = id => document.getElementById(id);

        /* ---------- Open / Close ---------- */
        window.qs_open = function () {
            if (qs_open_flag) return;
            qs_open_flag = true;
            $('qs-overlay').style.display = 'block';
            $('qs-modal').style.display = 'flex';
            applyTheme();
            setTimeout(() => { $('qs-input').focus(); }, 60);
            qs_show_state('hint');
        };

        window.qs_close = function () {
            if (!qs_open_flag) return;
            qs_open_flag = false;
            $('qs-overlay').style.display = 'none';
            $('qs-modal').style.display = 'none';
            $('qs-input').value = '';
            qs_cursor = -1; qs_items = [];
        };

        /* ---------- Keyboard shortcut ---------- */
        document.addEventListener('keydown', function (e) {
            // Ctrl+K หรือ Cmd+K (รองรับแป้นพิมพ์ภาษาไทยด้วย e.code)
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'k' || e.code === 'KeyK')) {
                e.preventDefault();
                qs_open_flag ? qs_close() : qs_open();
                return;
            }
            if (!qs_open_flag) return;

            if (e.key === 'Escape') { qs_close(); return; }

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                qs_cursor = Math.min(qs_cursor + 1, qs_items.length - 1);
                qs_highlight();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                qs_cursor = Math.max(qs_cursor - 1, -1);
                qs_highlight();
                if (qs_cursor === -1) $('qs-input').focus();
            } else if (e.key === 'Enter' && qs_cursor >= 0 && qs_items[qs_cursor]) {
                e.preventDefault();
                qs_items[qs_cursor].click();
            }
        });

        /* ---------- Input debounce ---------- */
        document.addEventListener('DOMContentLoaded', function () {
            $('qs-input').addEventListener('input', function () {
                const q = this.value.trim();
                clearTimeout(qs_timer);
                if (q.length < 2) { qs_show_state('hint'); return; }
                
                if ($('qs-results').style.display === 'block') {
                    $('qs-spinner').style.display = 'block'; // โชว์แค่สปินเนอร์เล็ก ไม่ซ่อนผลลัพธ์เก่า
                } else {
                    qs_show_state('loading'); // ถ้าไม่มีผลลัพธ์เก่าให้โชว์หน้าโหลดใหญ่
                }
                
                qs_timer = setTimeout(() => qs_fetch(q), 320);
            });
        });

        /* ---------- Fetch ---------- */
        function qs_fetch(q) {
            fetch('quick_search.php?q=' + encodeURIComponent(q))
                .then(r => r.json())
                .then(data => qs_render(data, q))
                .catch(() => qs_show_state('empty'));
        }

        /* ---------- Render ---------- */
        function qs_render(data, q) {
            qs_cursor = -1; qs_items = [];

            if (!data.success) { qs_show_state('empty'); return; }

            const menus = data.menus || [];
            const patients = data.results || [];

            if (menus.length === 0 && patients.length === 0) {
                $('qs-empty-kw').textContent = '"' + q + '"';
                qs_show_state('empty');
                return;
            }

            qs_show_state('results');

            /* — Menus — */
            const menuSec = $('qs-section-menus');
            const menuList = $('qs-menus-list');
            menuList.innerHTML = '';
            if (menus.length > 0) {
                menuSec.style.display = 'block';
                menus.forEach(m => {
                    const a = document.createElement('a');
                    a.href = m.menu_link;
                    a.className = 'qs-menu-item qs-nav-item';
                    a.innerHTML = `
                    <div class="qs-menu-icon">${m.menu_icon || '📄'}</div>
                    <span class="qs-menu-name">${qs_hl(m.menu_name, q)}</span>
                `;
                    menuList.appendChild(a);
                    qs_items.push(a);
                });
            } else {
                menuSec.style.display = 'none';
            }

            /* — Patients — */
            const patSec = $('qs-section-patients');
            const patList = $('qs-patients-list');
            patList.innerHTML = '';
            $('qs-count-badge').textContent = patients.length > 0 ? patients.length + ' รายการ' : '';

            if (patients.length > 0) {
                patSec.style.display = 'block';
                patients.forEach(p => {
                    const type = p.patient_type;
                    const badgeCls = type === 'OPD' ? 'qs-badge-opd' : (type === 'IPD' ? 'qs-badge-ipd' : 'qs-badge-ems');
                    const item = document.createElement('div');
                    item.className = 'qs-patient-item qs-nav-item';
                    item.tabIndex = 0;

                    // field ที่ถูกต้องจาก API
                    const debitDisplay = p.debit_fmt || '0.00';
                    const paidDisplay = p.paid_fmt || '0.00';
                    const hnDisplay = p.hn || '';

                    // วันรับบริการ: OPD = vstdate (visit_date), IPD = admdate - dchdate
                    let visitDisplay = '';
                    if (type === 'OPD') {
                        visitDisplay = p.visit_date || '';
                    } else {
                        // IPD แสดง admdate - dchdate
                        const adm = p.admdate || '';
                        const dch = p.visit_date || '';  // dchdate mapped to visit_date
                        if (adm && dch) visitDisplay = adm + ' – ' + dch;
                        else visitDisplay = adm || dch;
                    }

                    // ใบเสร็จ: bill ก่อน ถ้าว่างใช้ mobile_receipt
                    const billVal = (p.bill && p.bill !== '0000/0000' && p.bill !== '0' && p.bill !== '') ? p.bill : '';
                    const mobileRcp = p.mobile_receipt || '';
                    const mobileDate = p.mobile_rcpdate || '';
                    const rcpDisplay = billVal || mobileRcp;
                    const rcpDate = (p.billdate && p.billdate !== '' && p.billdate !== '-') ? p.billdate : mobileDate;

                    item.innerHTML = `
                    <span class="qs-type-badge ${badgeCls}">${type}</span>
                    <div class="qs-patient-info">
                        <p class="qs-patient-name">${qs_hl(p.ptname || '-', q)}</p>
                        <div class="qs-patient-meta" style="color: #696cff; font-weight: 500; font-size: 13px; margin-bottom: 4px;">
                            <span>🔹 ${qs_hl(p.accountname || '-', q)}</span>
                            <span>🔸 ${qs_hl(p.pttypename || '-', q)}</span>
                        </div>
                        <div class="qs-patient-meta">
                            <span>🔖 ${qs_hl(p.ref_id || '-', q)}</span>
                            ${hnDisplay ? `<span>🏥 HN ${qs_hl(hnDisplay, q)}</span>` : ''}
                            <span>🪪 ${qs_hl(p.cid || '-', q)}</span>
                            ${visitDisplay ? `<span>📅 ${visitDisplay}</span>` : `<span>📅 ${p.month || '-'}</span>`}
                            ${rcpDisplay ? `<span>🧾 ${qs_hl(rcpDisplay, q)}${rcpDate ? ' · ' + rcpDate : ''}</span>` : ''}
                        </div>
                    </div>
                    <div class="qs-patient-debit">
                        <div class="qs-debit-val">${debitDisplay} ฿</div>
                        <div class="qs-paid-val">ตามบิล ${paidDisplay} ฿</div>
                    </div>
                `;

                    /* คลิกเปิดหน้าลูกหนี้รายตัว ด้วย accountcode + month + type + parameter การค้นหา */
                    item.addEventListener('click', function () {
                        qs_close();
                        const ac = encodeURIComponent(p.accountcode || '');
                        const month = encodeURIComponent(p.month || '');
                        const pType = encodeURIComponent(p.patient_type || '');
                        const qParam = encodeURIComponent(p.cid || p.ptname || p.hn || '');
                        window.location.href = 'ลูกหนี้รายตัว.php?accountcode=' + ac + '&month=' + month + '&type=' + pType + '&q=' + qParam;
                    });

                    patList.appendChild(item);
                    qs_items.push(item);
                });
            } else {
                patSec.style.display = 'none';
            }
        }

        /* ---------- Keyboard highlight ---------- */
        function qs_highlight() {
            qs_items.forEach((el, i) => el.classList.toggle('qs-active', i === qs_cursor));
            if (qs_cursor >= 0 && qs_items[qs_cursor]) {
                qs_items[qs_cursor].scrollIntoView({ block: 'nearest' });
            }
        }

        /* ---------- Show state ---------- */
        function qs_show_state(state) {
            $('qs-hint').style.display = state === 'hint' ? 'block' : 'none';
            $('qs-loading').style.display = state === 'loading' ? 'flex' : 'none';
            $('qs-empty').style.display = state === 'empty' ? 'block' : 'none';
            $('qs-results').style.display = state === 'results' ? 'block' : 'none';
            $('qs-spinner').style.display = state === 'loading' ? 'block' : 'none';
        }

        /* ---------- Highlight keyword ---------- */
        function qs_hl(text, q) {
            if (!q || !text) return text || '';
            const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return String(text).replace(new RegExp('(' + escaped + ')', 'gi'), '<mark class="qs-hl">$1</mark>');
        }

        /* ---------- Prevent modal close on click inside ---------- */
        document.addEventListener('DOMContentLoaded', function () {
            const modal = document.getElementById('qs-modal');
            if (modal) modal.addEventListener('click', e => e.stopPropagation());
        });

    }());
</script>
